<div class="profile-container">
  <mat-card class="profile-card">
    <mat-card-header>
      <mat-card-title>My Profile</mat-card-title>
      <mat-card-subtitle>Manage your personal information</mat-card-subtitle>
    </mat-card-header>
        <div class="file-upload-container">
            <label class="file-upload-label">
                <span> Select a File </span>
                <input type="file" id="fileInput" (change)="onFileSelected($event)" hidden>
                <mat-icon>attach-file</mat-icon>
            </label>
            <div   class="image-preview">
            <div class="circle-image">
                        <img *ngIf="imagePreview" [src]="imagePreview" alt="Nouvelle image" class="preview-image">
                        
                        <img *ngIf="!imagePreview && existingImage" [src]="existingImage" alt="Image actuelle" class="preview-image">
                        
                    </div>
            </div>
        </div>
    <mat-card-content *ngIf="profileForm; else loading">
      <form #f="ngForm" (ngSubmit)="updateProfile()">
        
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Full Name</mat-label>
          <input matInput 
                 name="name" 
                    [(ngModel)]="profileForm.name"
                 required 
                 placeholder="Ex: Alexander Pierce">
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Email Address</mat-label>
          <input matInput 
                 type="email" 
                 name="email" 
                 [(ngModel)]="profileForm.email" 
                 required 
                 placeholder="admin@gmail.com">
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <div class="button-row">
          <button mat-raised-button 
                  color="primary" 
                  type="submit" 
                  [disabled]="f.invalid"
                  class="order-button">
            Update Profile
          </button>
        </div>
      </form>
    </mat-card-content>

    <ng-template #loading>
      <div class="loading-spinner">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Chargement du profil...</p>
      </div>
    </ng-template>
  </mat-card>
</div>
