<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">

    <h3 class="card-title">Coupons List</h3>
    &nbsp;
<div class="actions mb-3">
  <button  class="btn btn-sm btn-primary" routerLink="/admin/add-coupon">
     <i class="bi bi-plus-lg"></i>

  </button>
</div>
    <div class="input-group w-25" style="margin-left: auto;">
      <input type="text"
             class="form-control"
             placeholder="Search..."
             [(ngModel)]="searchText">
      <span class="input-group-text">
        <i class="bi bi-search"></i>
      </span>
    </div>

  </div>
  <div class="card-body table-responsive p-0">
    <table class="table table-hover text-nowrap">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Code</th>
          <th>Discount</th>
          <th>Expired Date</th>
          <th width="150">Actions</th>
        </tr>
      </thead>

      <tbody>
      <tr *ngFor="let coupon of filteredCoupons">
          <td>{{ coupon.name_cpn }}</td>
          <td>{{ coupon.code_cpn }}</td>
          <td>{{ coupon.discount }} %</td>
          <td>{{ coupon.expirationDate | date:'dd/MM/yyyy' }}</td>

          <td>
            <a class="btn btn-sm btn-info me-1"
               [routerLink]="['/admin/coupon', coupon.id, 'details']">
              <i class="bi bi-eye"></i>
            </a>

            <a class="btn btn-sm btn-warning me-1"
               [routerLink]="['/admin/coupon', coupon.id, 'edit']">
              <i class="bi bi-pencil"></i>
            </a>

            <button class="btn btn-sm btn-danger"
                    (click)="deleteCoupon(coupon.id)">
              <i class="bi bi-trash"></i>
            </button>
          </td>

        </tr>
      </tbody>
    </table>
  </div>
    <div class="card-footer d-flex justify-content-between align-items-center bg-white" *ngIf="coupons.length > 0">
  <small class="text-muted">
    Page {{ currentPage }} on {{ totalPages }} (Total : {{ coupons.length }} coupons)
  </small>
  
  <nav aria-label="Page navigation">
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="changePage(currentPage - 1)">Previous</button>
      </li>
      
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="changePage(currentPage + 1)">Next</button>
      </li>
    </ul>
  </nav>
</div>
</div>
