<div class="container">
        <h2>Update Coupon</h2>
    <form [formGroup]="couponForm" (ngSubmit)="updateCoupon()">

   
        <mat-form-field appearance="outline" class="form-field">
            <mat-label>Name Of Coupon</mat-label>
            <input matInput type="text" placeholder="Name" formControlName="name_cpn">
            <mat-error *ngIf="couponForm.get('name_cpn')?.hasError('required')">
                This Input is required!
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
            <mat-label>Code</mat-label>
            <input matInput  placeholder="Code" formControlName="code_cpn">
            <mat-error *ngIf="couponForm.get('code_cpn')?.hasError('required')">
                This Input is required!
            </mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="form-field">
            <mat-label>Discount</mat-label>
            <input matInput type="number" placeholder="Discount" formControlName="discount">
            <mat-error *ngIf="couponForm.get('discount')?.hasError('required')">
                This Input is required!
            </mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="form-field">
            <mat-label>Expiration Date</mat-label>
            <input matInput [matDatepicker]="picker"  formControlName="expirationDate">
                        <mat-hint>MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
            <mat-error *ngIf="couponForm.get('expirationDate')?.hasError('required')">
                This Input is required!
            </mat-error>
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit">Update Coupon</button>

    </form>
</div>
