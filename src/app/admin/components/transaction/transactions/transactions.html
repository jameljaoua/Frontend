<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">

    <h3 class="card-title">transactions List</h3>
  </div>
  <div class="card-body table-responsive p-0">
    <table class="table table-hover text-nowrap">
      <thead class="table-light">
        <tr>
          <th>User Name</th>
          <th>Order Id</th>
          <th>Amount</th>
          <th>Date</th>
          <th width="150">Actions</th>
        </tr>
      </thead>

      <tbody>
      <tr *ngFor="let transaction of transactions">


          <td>{{ transaction.userName }}</td>
          <td>{{ transaction.orderId }}</td>
          <td>{{ transaction.amount | currency:'USD' }}</td>
          <td>{{ transaction.datePayment | date:'dd/MM/yyyy' }}</td>



          <td>
            <a class="btn btn-sm btn-info me-1"
               [routerLink]="['/admin/transaction', transaction.id, 'details']">
              <i class="bi bi-eye"></i>
            </a>

          </td>

        </tr>
      </tbody>
    </table>
  </div>
</div>
