<div class="container">
        <h2>Update User</h2>
    <form [formGroup]="userForm" (ngSubmit)="updateUser()">
        <div class="file-upload-container">
            <label class="file-upload-label">
                <span> Select a File </span>
                <input type="file" id="fileInput" (change)="onFileSelected($event)" hidden>
                <mat-icon>attach-file</mat-icon>
            </label>
            <div  *ngIf="selectedFile" class="image-preview">
                <div class="circle-image">
                    <img [src]="imagePreview" alt="selected Image" class="preview-image">
                </div>

            </div>
                        <div  *ngIf="existingImage" class="image-preview">
                <div class="circle-image">
                    <img [src]="existingImage" alt="Existing Image" class="preview-image">
                </div>

            </div>
        </div>
  
        <mat-form-field appearance="outline" class="form-field">
            <mat-label>Name Of User</mat-label>
            <input matInput type="text" placeholder="Name" formControlName="name">
            <mat-error *ngIf="userForm.get('name')?.hasError('required')">
                This Input is required!
            </mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="form-field">
            <mat-label>Email </mat-label>
            <input matInput type="email" placeholder="Email" formControlName="email">
            <mat-error *ngIf="userForm.get('email')?.hasError('required')">
                This Input is required!
            </mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="form-field">
            <mat-label>Role</mat-label>
            <mat-select formControlName="userrole" name="userrole">
                <mat-option value="CUSTOMER" (click)="changeUserRole(userId, 'CUSTOMER')">CUSTOMER</mat-option>
                <mat-option value="ADMIN" (click)="changeUserRole(userId, 'ADMIN')">ADMIN</mat-option>

            </mat-select>
            <mat-error *ngIf="userForm.get('userrole')?.hasError('required')">
                This Input is required!
            </mat-error>
         </mat-form-field>

        <button mat-raised-button color="primary" type="submit">Update User</button>

    </form>
</div>
