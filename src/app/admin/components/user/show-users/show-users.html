<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">

    <h3 class="card-title">Users List</h3>
    &nbsp;
<div class="actions mb-3">
  <button  class="btn btn-sm btn-primary" routerLink="/admin/add-user">
     <i class="bi bi-plus-lg"></i>

  </button>
</div>
    <div class="input-group w-25" style="margin-left: auto;">
      <input type="text"
             class="form-control"
             placeholder="Search..."
             [(ngModel)]="searchText">
      <span class="input-group-text">
        <i class="bi bi-search"></i>
      </span>
    </div>

  </div>

  <div class="card-body table-responsive p-0">
    <table class="table table-hover text-nowrap">
      <thead class="table-light">
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th width="150">Actions</th>
        </tr>
      </thead>

      <tbody>
      <tr *ngFor="let user of filteredUsers">

          <td>
            <img [src]="user.processedImg"
                 width="60"
                 height="60"
                 style="object-fit: cover;">
          </td>

          <td>{{ user.name}}</td>

          <td>{{ user.email }}</td>

          <td>{{ user.userrole }}</td>
          <td>
            <a class="btn btn-sm btn-info me-1"
               [routerLink]="['/admin/user', user.id, 'details']">
              <i class="bi bi-eye"></i>
            </a>

            <a class="btn btn-sm btn-warning me-1"
               [routerLink]="['/admin/user', user.id, 'edit']">
              <i class="bi bi-pencil"></i>
            </a>

            <button class="btn btn-sm btn-danger"
                    (click)="deleteUser(user.id)">
              <i class="bi bi-trash"></i>
            </button>
          </td>

        </tr>
      </tbody>
    </table>
  </div>
</div>
