<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">

    <h3 class="card-title">Orders List</h3>
    
    <div class="input-group w-25" style="margin-left: auto;">
      <input type="text"
             class="form-control"
             placeholder="Search..."
             [(ngModel)]="searchQuery" (keyup.enter)="searchOrders()">
      <span class="input-group-text" (click)="searchOrders()" style="cursor: pointer;">
        <i class="bi bi-search"></i>
      </span>
    </div>
  </div>
  <div class="card-body table-responsive p-0">
    <table class="table table-hover text-nowrap">
      <thead class="table-light">
        <tr>
          <th>User Name</th>
          <th>Amount</th>
          <th>Description</th>
          <th>Phone</th>
          <th>Date</th>
          <th>Status</th>
          <th width="150">Actions</th>
        </tr>
      </thead>

      <tbody>
      <tr *ngFor="let order of paginatedOrders">



          <td>{{ order.userName }}</td>

          <td>{{ order.amount }}</td>

          <td>{{ order.orderDescription }}</td>

          <td>{{ order.phone }}</td>

          <td>{{ order.date | date:'dd/MM/yyyy' }}</td>
          <td> <ng-container [ngSwitch]="order.orderStatus">
  <span *ngSwitchCase="'Pending'" class="badge bg-warning text-dark">Pending</span>
  <span *ngSwitchCase="'Placed'" class="badge bg-info text-dark">Placed</span>
  <span *ngSwitchCase="'Purchased'" class="badge bg-success">Purchased</span>
        </ng-container></td>
          <td>
            <a class="btn btn-sm btn-info me-1"
               [routerLink]="['/admin/order', order.id, 'details']">
              <i class="bi bi-eye"></i>
            </a>
           <button class="btn btn-sm btn-danger"
                    (click)="deleteOrder(order.id)">
              <i class="bi bi-trash"></i>
            </button>
          </td>

        </tr>
      </tbody>
    </table>
  </div>
  <div class="card-footer d-flex justify-content-between align-items-center bg-white" *ngIf="orders.length > 0">
    <small class="text-muted">
      Page {{ currentPage }} on {{ totalPages }} (Total : {{ orders.length }} orders)
    </small>
    
    <nav aria-label="Page navigation">
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" (click)="changePage(currentPage - 1)">Previous</button>
        </li>
        
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link" (click)="changePage(currentPage + 1)">Next</button>
        </li>
      </ul>
    </nav>
  </div>
</div>
