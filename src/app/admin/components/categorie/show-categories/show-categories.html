<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">

    <h3 class="card-title">Categories List</h3>
    &nbsp;
<div class="actions mb-3">
  <button  class="btn btn-sm btn-primary" routerLink="/admin/add-category">
     <i class="bi bi-plus-lg"></i>

  </button>
</div>
    <div class="input-group w-25" style="margin-left: auto;">
      <input type="text"
             class="form-control"
             placeholder="Search..."
             [(ngModel)]="searchText">
      <span class="input-group-text">
        <i class="bi bi-search"></i>
      </span>
    </div>

  </div>
  <div class="card-body table-responsive p-0">
    <table class="table table-hover text-nowrap">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Products</th>
          <th>Subcategories</th>   

          <th width="150">Actions</th>
        </tr>
      </thead>

      <tbody>
      <tr *ngFor="let category of filteredCategories">
          <td>{{ category.name_cat }}</td>
          <td>{{ category.description_cat }}</td>
       <!-- CORRECTION: Afficher les produits de cette catégorie -->
          <td>
 <ul class="list-unstyled mb-0">
  <li *ngFor="let product of category.products" 
      class="mb-1"
      title="{{ product.description_prod }}">
    <i class="bi bi-dot me-1"></i>{{ product.name_prod }}
  </li>
  <li *ngIf="!category.products || category.products.length === 0" 
      class="text-muted fst-italic">
    No products
  </li>
</ul>
          </td>
              <!-- colonne Sous-catégories -->
      <td>
        <ul class="list-unstyled mb-0">
          <li *ngFor="let sub of category.subcategories" class="mb-1">
            <i class="bi bi-folder me-1"></i>{{ sub.name_subcat }}
          </li>
          <li *ngIf="!category.subcategories?.length" class="text-muted fst-italic">No subcategories</li>
        </ul>
      </td>
          <td>
            <a class="btn btn-sm btn-info me-1"
               [routerLink]="['/admin/category', category.id, 'details']">
              <i class="bi bi-eye"></i>
            </a>

            <a class="btn btn-sm btn-warning me-1"
               [routerLink]="['/admin/category', category.id, 'edit']">
              <i class="bi bi-pencil"></i>
            </a>

            <button class="btn btn-sm btn-danger"
                    (click)="deleteCategory(category.id)">
              <i class="bi bi-trash"></i>
            </button>
          </td>

        </tr>
      </tbody>
    </table>
  </div>
</div>
