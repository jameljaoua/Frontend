<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">

    <h3 class="card-title">Notifications List</h3>
                <div class="input-group w-25" style="margin-left: auto;">
      <input type="text"
             class="form-control"
             placeholder="Search..."
             [(ngModel)]="searchQuery" (keyup.enter)="searchNotifications()">
      <span class="input-group-text" (click)="searchNotifications()" style="cursor: pointer;">
        <i class="bi bi-search"></i>
      </span>
    </div>
  </div>
  <div class="card-body table-responsive p-0">
    <table class="table table-hover text-nowrap">
      <thead class="table-light">
        <tr>
          <th>Title</th>
          <th>Message</th>
          <th>Read Status</th>
          <th>created At</th>
        </tr>
      </thead>

      <tbody>
      <tr *ngFor="let notif of notifications">


          <td>{{ notif.title }}</td>
          <td>{{ notif.message }}</td>
          <td>{{ notif.isRead ? 'Read' : 'Unread' }}</td>
          <td>{{ notif.createdAt | date:'dd/MM/yyyy' }}</td>

        </tr>
      </tbody>
    </table>
  </div>
      <div class="card-footer d-flex justify-content-between align-items-center bg-white" *ngIf="notifications.length > 0">
    <small class="text-muted">
      Page {{ currentPage }} on {{ totalPages }} (Total : {{ notifications.length }} notifications)
    </small>
    
    <nav aria-label="Page navigation">
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" (click)="changePage(currentPage - 1)">Previous</button>
        </li>
        
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link" (click)="changePage(currentPage + 1)">Next</button>
        </li>
      </ul>
    </nav>
  </div>
</div>
