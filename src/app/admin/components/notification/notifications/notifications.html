<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">

    <h3 class="card-title">Notifications List</h3>
  </div>
  <div class="card-body table-responsive p-0">
    <table class="table table-hover text-nowrap">
      <thead class="table-light">
        <tr>
          <th>Title</th>
          <th>Message</th>
          <th>Read Status</th>
          <th>created At</th>
        </tr>
      </thead>

      <tbody>
      <tr *ngFor="let notif of notifications">


          <td>{{ notif.title }}</td>
          <td>{{ notif.message }}</td>
          <td>{{ notif.isRead ? 'Read' : 'Unread' }}</td>
          <td>{{ notif.createdAt | date:'dd/MM/yyyy' }}</td>

        </tr>
      </tbody>
    </table>
  </div>
</div>
