<div class="auth">
    <div class="container" [class.active]="isActive">
        <!-- Formulaire d'inscription (Register) -->
        <div class="form-box register">
            <form (ngSubmit)="onSubmit()" [formGroup]="signupForm">
                <h1>Registration</h1>
                <div class="input-box">
                    <input type="text" placeholder="Name" formControlName="name" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="email" placeholder="Email" formControlName="email" required>
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box">
                    <input [type]="hidePassword ? 'password' : 'text'" placeholder="Password" formControlName="password" required>
                    <i class='bx bxs-lock-alt' (click)="togglePasswordVisibility()" style="cursor: pointer;"></i>
                </div>
                <div class="input-box">
                    <input [type]="hidePassword ? 'password' : 'text'" placeholder="Confirm Password" formControlName="confirmPassword" required>
                    <i class='bx bxs-lock-alt' (click)="togglePasswordVisibility()" style="cursor: pointer;"></i>
                </div>
                <button type="submit" class="btn" [disabled]="signupForm.invalid">Register</button>

            </form>
        </div>

        <!-- Panneau de bascule (Toggle Box) - DOIT ÊTRE SÉPARÉ -->
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Welcome Back!</h1>
                <p>Already have an account?</p>
                <button class="btn login-btn" (click)="showLogin()">Login</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Hello, Welcome!</h1>
                <p>Don't have an account?</p>
                <button class="btn register-btn" (click)="showRegister()">Register</button>
            </div>


        </div>
    </div>
</div>
