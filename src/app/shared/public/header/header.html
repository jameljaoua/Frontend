<!-- ==================== Mobile Menu Start Here ==================== -->
<div class="mobile-menu d-lg-none d-block" [class.active]="isMobileMenuOpen">
    <button type="button" class="close-button" (click)="closeMobileMenu()"> <i class="las la-times"></i> </button>
    <div class="mobile-menu__inner">
        <a routerLink="/" class="mobile-menu__logo">
            <img src="pubcl/images/logo/logo.png" alt="Logo" class="white-version">
            <img src="pubcl/images/logo/white-logo-two.png" alt="Logo" class="dark-version">
        </a>
        <div class="mobile-menu__menu">
            <ul class="nav-menu flx-align nav-menu--mobile">
                <li class="nav-menu__item has-submenu">
                    <a href="javascript:void(0)" class="nav-menu__link">Home</a>
                    <ul class="nav-submenu">
                        <li class="nav-submenu__item"><a routerLink="/" class="nav-submenu__link">Home</a></li>
                    </ul>
                </li>
                <li class="nav-menu__item has-submenu">
                    <a href="javascript:void(0)" class="nav-menu__link">Products</a>
                    <ul class="nav-submenu">
                        <li class="nav-submenu__item"><a routerLink="/shop" class="nav-submenu__link">All Products</a></li>
                    </ul>
                </li>
                <li class="nav-menu__item">
                    <a routerLink="/about" class="nav-menu__link">About us</a>
                </li>
                <li class="nav-menu__item">
                    <a routerLink="/contact" class="nav-menu__link">Contact</a>
                </li>
            </ul>

            <div class="header-right__inner d-lg-none my-3 gap-1 d-flex flx-align" *ngIf="!isCustomerLoggedIn && !isAdminLoggedIn">
                <a routerLink="/register" class="btn btn-main pill">
                    <span class="icon-left icon">
                        <img src="pubcl/images/icons/user.svg" alt="">
                    </span>Create Account
                </a>
            </div>
            <div class="header-right__inner d-lg-none my-3 gap-1 d-flex flx-align" *ngIf="isCustomerLoggedIn || isAdminLoggedIn">
                <a [routerLink]="isAdminLoggedIn ? '/admin/dashboard' : '/customer/dashboard'" class="btn btn-main pill">
                    Mon compte
                </a>
                <a (click)="logout()" class="btn btn-outline-main pill">Déconnexion</a>
            </div>
        </div>
    </div>
</div>
<!-- ==================== Mobile Menu End Here ==================== -->

<!-- ==================== Header Start Here ==================== -->
<header class="header">
    <div class="container container-full">
        <nav class="header-inner flx-between">
            <!-- Logo Start -->
            <div class="logo">
                <a routerLink="/" class="link white-version">
                    <img src="pubcl/images/logo/logo.png" alt="Logo">
                </a>
                <a routerLink="/" class="link dark-version">
                    <img src="pubcl/images/logo/white-logo.png" alt="Logo">
                </a>
            </div>
            <!-- Logo End  -->

            <!-- Menu Start  -->
            <div class="header-menu d-lg-block d-none">
                <ul class="nav-menu flx-align">
                    <li class="nav-menu__item">
                        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-menu__link">Home</a>
                    </li>
                    <li class="nav-menu__item has-submenu">
                        <a href="javascript:void(0)" class="nav-menu__link">Products</a>
                        <ul class="nav-submenu">
                            <li class="nav-submenu__item">
                                <a routerLink="/shop" class="nav-submenu__link"> All Products</a>
                            </li>
                            <li class="nav-submenu__item" *ngFor="let category of categories">
                                <a (click)="onCategoryClick(category)" class="nav-submenu__link"> {{ category.name_cat }}</a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-menu__item">
                        <a routerLink="/about" routerLinkActive="active" class="nav-menu__link">About us</a>
                    </li>
                    <li class="nav-menu__item">
                        <a routerLink="/contact" routerLinkActive="active" class="nav-menu__link">Contact</a>
                    </li>
                </ul>
            </div>
            <!-- Menu End  -->

            <!-- Header Right start -->
            <div class="header-right flx-align">
                <a routerLink="/login" class="header-right__button cart-btn position-relative">
                    <img src="pubcl/images/icons/cart.svg" alt="" class="white-version">
                    <img src="pubcl/images/icons/cart-white.svg" alt="" class="dark-version">
                    <span class="qty-badge font-12">{{ cartCount }}</span>
                </a>

                <!-- Light Dark Mode -->
                <div class="theme-switch-wrapper position-relative">
                    <label class="theme-switch" for="checkbox">
                        <input type="checkbox" class="d-none" id="checkbox" (change)="toggleDarkMode()">
                        <span class="slider text-black header-right__button white-version">
                            <img src="pubcl/images/icons/sun.svg" alt="">
                        </span>
                        <span class="slider text-black header-right__button dark-version">
                            <img src="pubcl/images/icons/moon.svg" alt="">
                        </span>
                    </label>
                </div>

                <div class="header-right__inner gap-3 flx-align d-lg-flex d-none">
                    <!-- Utilisateur non connecté -->
                    <ng-container *ngIf="!isCustomerLoggedIn && !isAdminLoggedIn">
                        <a routerLink="/login" class="btn btn-outline-main pill">Sign in</a>
                        <a routerLink="/register" class="btn btn-main pill">
                            <span class="icon-left icon">
                                <img src="pubcl/images/icons/user.svg" alt="">
                            </span>Create Account
                        </a>
                    </ng-container>

                    <!-- Utilisateur connecté -->
                    <ng-container *ngIf="isCustomerLoggedIn || isAdminLoggedIn">
                        <a [routerLink]="isAdminLoggedIn ? '/admin/dashboard' : '/customer/dashboard'" class="btn btn-outline-main pill">
                            Mon compte
                        </a>
                        <a (click)="logout()" class="btn btn-main pill">Déconnexion</a>
                    </ng-container>
                </div>
                <button type="button" class="toggle-mobileMenu d-lg-none" (click)="openMobileMenu()"> <i class="las la-bars"></i> </button>
            </div>
            <!-- Header Right End  -->
        </nav>
    </div>
</header>
<!-- ==================== Header End Here ==================== -->
