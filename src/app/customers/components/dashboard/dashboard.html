 <div class="container my-5">
 <div class="row account-container">
    <div class="col-lg-3 sidebar p-0">
        <app-customer-sidebar></app-customer-sidebar>
    </div>
    <div class="col-lg-9 main-content">
                <div id="dashboard" class="page-content active">
                    <h2 class="mb-4">My Account Dashboard</h2>
                    
                    <!-- Stats Cards -->
                    <div class="row mb-5">
                        <div class="col-md-4">
                            <div class="card stats-card">
                                <div class="card-body">
                                    <h5 class="card-title">Orders</h5>
                                    <h2 class="card-text">{{ myOrder.length  }}</h2>
                                    <i class="fas fa-shopping-bag card-icon text-primary"></i>
                                </div>
                            </div>
                        </div>

                    </div>
                    
                    <!-- Recent Orders -->
                    <div class="card mb-4">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">My Orders</h5>
                            <a href="/customer/my-orders" class="btn btn-sm btn-outline-primary">View All</a>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>Order ID</th>
                                            <th>Amount</th>
                                            <th>Description</th>
                                            <th>Phone</th>
                                            <th>Date</th>
                                            <th>Status</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let order of myOrder">
                                            <td>{{ order.id }}</td>
                                            <td>{{ order.amount }}</td>
                                            <td>{{ order.orderDescription }}</td>
                                            <td>{{ order.phone }}</td>
                                            <td>{{ order.date | date:'dd/MM/yyyy' }}</td>
                                            <td> <ng-container [ngSwitch]="order.orderStatus">
                                            <span *ngSwitchCase="'Pending'" class="badge bg-warning text-dark">Pending</span>
                                            <span *ngSwitchCase="'Placed'" class="badge bg-info text-dark">Placed</span>
                                            <span *ngSwitchCase="'Purchased'" class="badge bg-success">Purchased</span>
                                             </ng-container></td>
                                            <td><span *ngIf="order.orderStatus === 'Placed'"><a routerLink="/customer/ordered-products/{{ order.id }}" class="btn btn-sm btn-outline-primary">View</a></span>
                                            <span *ngIf="order.orderStatus === 'Purchased'"><a routerLink="/customer/purchased-orders/{{ order.id }}" class="btn btn-sm btn-outline-primary">View</a></span>
                                            </td>
                                        </tr>

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                  
                </div>
    </div>
 </div>
 </div>
