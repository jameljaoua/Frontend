<!-- ==================== Cart Personal Info Start ==================== -->
<section class="cart-personal padding-y-120">
    <div class="container container-two">
        <form action="#">
        <div class="row gy-5">
            <div class="col-lg-8 pe-sm-5">
                <div class="cart-personal__content">
                    <h5 class="cart-personal__title mb-32">Personal information</h5>

                    <div *ngIf="profileForm">
                        <div class="mb-4">
                            <label for="email" class="form-label font-18 mb-2 fw-500 font-heading">Email Address <span class="text-danger">*</span></label>
                            <input type="email" class="common-input" id="email" placeholder="Email address" [(ngModel)]="profileForm.email" name="email">
                        </div>
                        <div class="mb-4">
                            <label for="name" class="form-label font-18 mb-2 fw-500 font-heading">Name <span class="text-danger">*</span></label>
                            <input type="text" class="common-input" id="name" placeholder="Full name" [(ngModel)]="profileForm.name" name="name">
                        </div>
                        <div class="mb-4">
                            <label for="phone" class="form-label font-18 mb-2 fw-500 font-heading">Phone Number</label>
                            <input type="text" class="common-input" id="phone" placeholder="Phone number" [value]="profileForm?.phone || ''" name="phone">
                        </div>
                    </div>
                </div>

                <!-- Payment Method -->
                <div class="card common-card shadow mt-4">
                    <div class="card-header bg-transparent border-0 pb-0">
                        <h6 class="mb-0">Card Details</h6>
                    </div>
                    <div class="card-body">
                        <div id="card-element" class="form-control" style="padding: 12px; height: 45px;"></div>
                        <div id="card-errors" role="alert" class="text-danger small mt-2"></div>
                    </div>
                </div>

                <div class="cart-content__bottom flx-between gap-2 mt-32">
                    <a routerLink="/customer/cart" class="btn btn-outline-light flx-align gap-2 pill btn-lg">
                        <span class="icon line-height-1 font-20"><i class="las la-arrow-left"></i></span>
                        Back
                    </a>
                </div>
            </div>

            <!-- Résumé de commande -->
            <div class="col-lg-4">
                <div class="order-summary">
                    <h5 class="order-summary__title mb-32">Order Summary</h5>
                    <ul class="billing-list">
                        <li class="billing-list__item flx-between">
                            <span class="text text-heading font-20 fw-500 font-heading">Total</span>
                            <span class="amount text-heading font-20 fw-500 font-heading">{{ totalAmount | currency }}</span>
                        </li>
                    </ul>
                    <button type="button" (click)="pay()" [disabled]="isProcessing" class="btn btn-main pill btn-lg w-100 mt-32">
                        <span class="icon icon-left" *ngIf="!isProcessing">
                            <img src="assets/dpmarket/images/icons/cart-white.svg" alt="">
                        </span>
                        {{ isProcessing ? 'Processing...' : 'Pay ' + (totalAmount | currency) }}
                    </button>
                </div>
            </div>
        </div>
        </form>
    </div>
</section>
<!-- ==================== Cart Personal Info End ==================== -->
