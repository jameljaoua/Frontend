<section class="dashboard">
    <div class="dashboard__inner d-flex">
        <app-customer-sidebar></app-customer-sidebar>

        <div class="dashboard-body">
            <div class="dashboard-body__content padding-y-60">
                <div class="container container-two">
                    <h4 class="mb-32">Profile Details</h4>

                    <div class="row gy-4">

                        <!-- Informations personnelles -->
                        <div class="col-lg-8">
                            <div class="dashboard-card">
                                <div class="dashboard-card__header mb-24">
                                    <h6 class="dashboard-card__title mb-0">Personal Information</h6>
                                </div>

                                <form #f="ngForm" (ngSubmit)="updateProfile()" *ngIf="profileForm">
                                    <div class="mb-4">
                                        <label for="name" class="form-label font-16 fw-500 mb-2">Name</label>
                                        <input type="text" class="common-input" id="name"
                                               name="name"
                                               [(ngModel)]="profileForm.name"
                                               required>
                                    </div>

                                    <div class="mb-4">
                                        <label for="email" class="form-label font-16 fw-500 mb-2">Email Address</label>
                                        <input type="email" class="common-input" id="email"
                                               name="email"
                                               [(ngModel)]="profileForm.email"
                                               required>
                                    </div>

                                    <button type="submit" class="btn btn-main pill" [disabled]="f.invalid">Save Changes</button>
                                </form>
                            </div>
                        </div>

                        <!-- Photo de profil -->
                        <div class="col-lg-4">
                            <div class="dashboard-card text-center">
                                <div class="dashboard-card__header mb-24">
                                    <h6 class="dashboard-card__title mb-0">Profile Photo</h6>
                                </div>

                                <div *ngIf="imagePreview">
                                    <img [src]="imagePreview" alt="Profile" class="rounded-circle mb-3" style="width: 160px; height: 160px; object-fit: cover;">
                                </div>
                                <div *ngIf="!imagePreview && existingImage">
                                    <img [src]="existingImage" alt="Profile" class="rounded-circle mb-3" style="width: 160px; height: 160px; object-fit: cover;">
                                </div>
                                <div *ngIf="!imagePreview && !existingImage">
                                    <img src="assets/dpmarket/images/thumbs/user-profile.png" alt="Default Profile" class="rounded-circle mb-3" style="width: 160px; height: 160px; object-fit: cover;">
                                </div>

                                <div class="d-flex justify-content-center gap-2">
                                    <input type="file" #fileInput (change)="onImageSelected($event)" hidden accept="image/*">

                                    <button type="button" class="btn btn-main btn-sm pill" (click)="fileInput.click()">
                                        Upload New
                                    </button>

                                    <button type="button" class="btn btn-outline-light btn-sm pill text-danger" (click)="removeExistingFile()">
                                        Remove
                                    </button>
                                </div>
                                <p class="text-body mt-3 font-14">Recommended: Square JPG, PNG, at least 200x200 pixels</p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
