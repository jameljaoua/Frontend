<section class="dashboard">
    <div class="dashboard__inner d-flex">
        <app-customer-sidebar></app-customer-sidebar>

        <div class="dashboard-body">
            <div class="dashboard-body__content padding-y-60">
                <div class="container container-two">
                    <h4 class="mb-32">My Notifications</h4>

                    <div class="dashboard-card">
                        <div class="dashboard-card__header flx-between gap-2 mb-24">
                            <h6 class="dashboard-card__title mb-0">All Notifications</h6>
                        </div>

                        <div class="table-responsive">
                            <table class="table style-two">
                                <thead>
                                    <tr>
                                        <th>Title</th>
                                        <th>Message</th>
                                        <th>Status</th>
                                        <th>Created At</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let notification of myNotifications">
                                        <td class="fw-600 text-heading">{{ notification.title }}</td>
                                        <td class="text-body">{{ notification.message }}</td>
                                        <td>
                                            <span class="badge" [ngClass]="notification.isRead ? 'bg-secondary' : 'bg-main'">
                                                {{ notification.isRead ? 'Read' : 'Unread' }}
                                            </span>
                                        </td>
                                        <td>{{ notification.createdAt | date:'dd/MM/yyyy' }}</td>
                                    </tr>
                                    <tr *ngIf="!myNotifications || myNotifications.length === 0">
                                        <td colspan="4" class="text-center text-body py-4">Aucune notification pour le moment.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</section>
