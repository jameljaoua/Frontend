<div *ngIf="product">

<!-- ==================== Breadcrumb Start ==================== -->
<section class="breadcrumb border-bottom p-0 d-block section-bg position-relative z-index-1">
    <div class="breadcrumb-two">
        <img src="pubcl/images/gradients/breadcrumb-gradient-bg.png" alt="" class="bg--gradient">
        <div class="container container-two">
            <div class="row justify-content-center">
                <div class="col-lg-12">
                    <div class="breadcrumb-two-content">

                        <ul class="breadcrumb-list flx-align gap-2 mb-2">
                            <li class="breadcrumb-list__item font-14 text-body">
                                <a routerLink="/customer/" class="breadcrumb-list__link text-body hover-text-main">Home</a>
                            </li>
                            <li class="breadcrumb-list__item font-14 text-body">
                                <span class="breadcrumb-list__icon font-10"><i class="fas fa-chevron-right"></i></span>
                            </li>
                            <li class="breadcrumb-list__item font-14 text-body">
                                <a routerLink="/customer/shop" class="breadcrumb-list__link text-body hover-text-main">Products</a>
                            </li>
                            <li class="breadcrumb-list__item font-14 text-body">
                                <span class="breadcrumb-list__icon font-10"><i class="fas fa-chevron-right"></i></span>
                            </li>
                            <li class="breadcrumb-list__item font-14 text-body">
                                <span class="breadcrumb-list__text">{{ product.categoryName }}</span>
                            </li>
                        </ul>

                        <h3 class="breadcrumb-two-content__title mb-3 text-capitalize">{{ product.name_prod }}</h3>

                        <div class="breadcrumb-content flx-align gap-3">
                            <div class="breadcrumb-content__item text-heading fw-500 flx-align gap-2">
                                <span class="text">Category:
                                    <a [routerLink]="['/customer/category-products', product.categoryId]" class="link text-main fw-600">{{ product.categoryName }}</a>
                                </span>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- ==================== Breadcrumb End ==================== -->

<!-- ==================== Product Details Section Start ==================== -->
<div class="product-details mt-32 padding-b-120">
    <div class="container container-two">
        <div class="row gy-4">

            <!-- Colonne gauche : image + description -->
            <div class="col-lg-8">
                <div class="product-details">
                    <div class="product-details__thumb">
                        <img [src]="product.processedImg" [alt]="product.name_prod"
                             onerror="this.src='pubcl/images/thumbs/product-placeholder.png'">
                    </div>

                    <div class="product-details__item">
                        <h5 class="product-details__title mb-3">Description</h5>
                        <p class="product-details__desc">{{ product.description_prod }}</p>
                    </div>
                </div>
            </div>

            <!-- Colonne droite : prix + achat -->
            <div class="col-lg-4">
                <div class="product-sidebar section-bg">
                    <div class="product-sidebar__top position-relative flx-between gap-1">
                        <h6 class="product-sidebar__title">{{ product.price | currency }}</h6>
                    </div>

                    <ul class="sidebar-list">
                        <li class="sidebar-list__item flx-align gap-2 font-14 fw-300 mb-2">
                            <span class="icon"><img src="pubcl/images/icons/check-cirlce.svg" alt=""></span>
                            <span class="text">Qualité vérifiée</span>
                        </li>
                        <li class="sidebar-list__item flx-align gap-2 font-14 fw-300">
                            <span class="icon"><img src="pubcl/images/icons/check-cirlce.svg" alt=""></span>
                            <span class="text">Livraison instantanée après paiement</span>
                        </li>
                    </ul>

                    <button type="button" class="btn btn-main d-flex w-100 justify-content-center align-items-center gap-2 pill px-sm-5 mt-32"
                            (click)="addToCart(product.id)">
                        <img src="pubcl/images/icons/add-to-cart.svg" alt="">
                        Add To Cart
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>
<!-- ==================== Product Details Section End ==================== -->

</div>
