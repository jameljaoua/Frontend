<section class="dashboard">
    <div class="dashboard__inner d-flex">
        <app-customer-sidebar></app-customer-sidebar>

        <div class="dashboard-body">
            <div class="dashboard-body__content padding-y-60">
                <div class="container container-two">
                    <h4 class="mb-32">My Orders</h4>

                    <div class="dashboard-card">
                        <div class="dashboard-card__header flx-between gap-2 mb-24">
                            <h6 class="dashboard-card__title mb-0">All Orders</h6>
                            <a routerLink="/customer/my-orders" class="btn btn-outline-light btn-sm pill">View All</a>
                        </div>

                        <div class="table-responsive">
                            <table class="table style-two">
                                <thead>
                                    <tr>
                                        <th>Order ID</th>
                                        <th>Amount</th>
                                        <th>Description</th>
                                        <th>Phone</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let order of myOrder">
                                        <td>{{ order.id }}</td>
                                        <td>{{ order.amount | currency }}</td>
                                        <td>{{ order.orderDescription }}</td>
                                        <td>{{ order.phone }}</td>
                                        <td>{{ order.date | date:'dd/MM/yyyy' }}</td>
                                        <td>
                                            <ng-container [ngSwitch]="order.orderStatus">
                                                <span *ngSwitchCase="'Pending'" class="badge bg-warning text-dark">Pending</span>
                                                <span *ngSwitchCase="'Placed'" class="badge bg-info text-dark">Placed</span>
                                                <span *ngSwitchCase="'Purchased'" class="badge bg-success">Purchased</span>
                                            </ng-container>
                                        </td>
                                        <td>
                                            <a *ngIf="order.orderStatus === 'Pending'" [routerLink]="['/customer/ordered-products', order.id]" class="btn btn-outline-light btn-sm pill">View</a>
                                            <a *ngIf="order.orderStatus === 'Placed'" [routerLink]="['/customer/ordered-products', order.id]" class="btn btn-outline-light btn-sm pill">View</a>
                                            <a *ngIf="order.orderStatus === 'Purchased'" [routerLink]="['/customer/purchased-orders', order.id]" class="btn btn-outline-light btn-sm pill">View</a>
                                        </td>
                                    </tr>
                                    <tr *ngIf="!myOrder || myOrder.length === 0">
                                        <td colspan="7" class="text-center text-body py-4">Vous n'avez pas encore de commande.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</section>
