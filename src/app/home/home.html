<div class="feature-section mt-60">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="white-bg border px-4 py-3">
                    <div class="row">
                        <div class="mb-20 col-12 col-sm-12 col-md-6 col-lg-3">
                            <div class="feature-item">
                                <div class="feature-icon">
                                    <img src="pubcl/images/icon/delivery-truck.png" class="w-100" alt="truck Icon">
                                </div>
                                <div class="feature-info pt-3 ps-2">
                                    <h4>Instant Delivary</h4>
                                    <p>After payment, access to the product&nbsp;<strong>is immediate</strong></p>
                                </div>
                            </div>
                        </div>

                        <div class="mb-20 col-12 col-sm-12 col-md-6 col-lg-3">
                            <div class="feature-item">
                                <div class="feature-icon">
                                    <img src="pubcl/images/icon/credit-card.png" class="w-100" alt="truck Icon">
                                </div>
                                <div class="feature-info pt-3 ps-2">
                                    <h4>Secure Checkout</h4>
                                    <p>100% Payment Secure.</p>
                                </div>
                            </div>
                        </div>
                        <div class="mb-20 col-12 col-sm-12 col-md-6 col-lg-3">
                            <div class="feature-item">
                                <div class="feature-icon">
                                    <img src="pubcl/images/icon/customer-service.png" class="w-100" alt="truck Icon">
                                </div>
                                <div class="feature-info pt-3 ps-2">
                                    <h4>Online Support</h4>
                                    <p>Ensure the product quality</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="category-list mt-60">
    <div class="container">
  

        <!-- Categories Carousel avec ngx-owl-carousel-o -->
        <owl-carousel-o [options]="customOptions" *ngIf="categories.length > 0">
            <ng-container *ngFor="let category of categories">
                <ng-template carouselSlide>
                    <div class="item">
                        <a [routerLink]="['/category-products', category.id]" class="text-decoration-none">
                            <div class="category-title d-flex justify-content-center align-items-center">
                                <p class="text-nowrap mt-2 fw-normal text-black">{{ category.name_cat }}</p>
                            </div>
                        </a>
                    </div>
                </ng-template>
            </ng-container>
        </owl-carousel-o>

    </div>
</div>
<div class="container mt-60">
    <div class="row g-3">
        <!-- Boucle sur les catégories -->
        <div class="col-md-12" *ngFor="let category of categories">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0 section-title">{{ category.name_cat }}</h5>
                <a [routerLink]="['/category-products', category.id]" class="text-decoration-none view-all">View All</a>
            </div>
            
            <!-- Carousel de produits pour cette catégorie -->
         <div *ngIf="category.products && category.products.length > 0;">

            <owl-carousel-o [options]="productCarouselOptions">
                <ng-container *ngFor="let product of category.products">
                    <ng-template carouselSlide>
                        <div class="product-card">
                            
                            <img [src]="product.processedImg"  style="align-content: center;"  class="img-fluid mb-2 product-img" 
                                         [alt]="product.name_prod">

                            <h6><a [routerLink]="['/single-product', product.id]">{{ product.name_prod }}</a></h6>
                            <div>
                                <span class="price">{{ product.price | currency }}</span>
                            </div>

                            <button class="btn btn-primary w-100" [routerLink]="['/login']">
                                <i class="fas fa-shopping-cart me-2"></i>Add to Cart
                            </button>
                        </div>
                    </ng-template>
                </ng-container>
            </owl-carousel-o>
           </div> 
 
        </div>
    </div>
</div>
